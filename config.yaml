# Firma Web Sitesi ve E-posta Bulucu - Konfigürasyon Dosyası

# Skor eşikleri
skor:
  yuksek_esik: 65  # 65 ve üzeri direkt kabul
  dusuk_esik: 40   # 40'in altı direkt reddet

# Bekleme süreleri (saniye)
bekleme:
  min_arasi: 6.0      # Firmalar arası minimum bekleme
  max_arasi: 14.0     # Firmalar arası maksimum bekleme
  min_mail: 0.5     # Mail taraması minimum bekleme
  max_mail: 1.5     # Mail taraması maksimum bekleme

# Dosya yolları
dosyalar:
  input: firmalar.xlsx
  output_web: firmalar_web.xlsx
  output_mail: firmalar_mail.xlsx
  log: firma_bulucu.log

# Google Arama Ayarları
google:
  max_aday: 10      # Maksimum aday domain sayısı.
                    # Ölçüm: SERP'te organik sonuç sayısı medyan 8, aramaların
                    # %70'inde 6'dan fazla. 6'da kesince kuyruktaki sonuçlar hiç
                    # puanlanmıyordu. Adaylar skora göre sıralanır; eşit skorda
                    # Google sırası korunur (stabil sort), ek ağ maliyeti yok.
  captcha_timeout: 600  # CAPTCHA çözümü için maksimum bekleme (saniye)

# Chrome Ayarları
chrome:
  debug_port: 9222  # Chrome remote debugging port

# Mail Tarama Ayarları
mail:
  max_iletisim_sayfasi: 5  # Maksimum taranacak iletişim sayfası
  max_sitemap_sayfa: 5     # Maksimum sitemap sayfası
  timeout: 12              # HTTP isteği timeout (saniye)
  retries: 2               # Retry sayısı
  workers: 8               # Aynı anda taranacak firma sayısı (paralel işçi).
                           # Her firma farklı bir site olduğu için tek siteye
                           # yük binmez. Bağlantın iyiyse 12-16 da denenebilir.

# LLM Ayarları
# Groq 16 Ağustos 2026'da llama-3.3-70b-versatile'i kapattı (404).
llm:
  model: openai/gpt-oss-120b
  temperature: 0.3
  max_tokens: 512  # gpt-oss düşünme jetonu için 80 yetmez
  enabled: true  # false yaparsanız LLM devre dışı kalır

